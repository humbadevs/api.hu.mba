name: API Deploy and Execute
on:
  push:
    branches: master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Node Setup
      uses: actions/setup-node@v1.1.0
    - name: Install packages
      run: npm i
    - name: Setup server
      uses: appleboy/ssh-action@master
      env:
          DBPw: ${{ secrets.DBPw }}
      with:
        host: server.max.berlin
        username: humba
        key: ${{ secrets.HUMBA_PRIVATE_SSH_KEY }}
        port: 22
        envs: DBPw
        script: |
          cd /home/humba/host/api/
          git clone https://github.com/humbadevs/api.hu.mba.git
          cd api.hu.mba
          git pull
          npm i
          fuser -k 4563/tcp
          nohup node server.js &
          echo success
          disown
          exit
